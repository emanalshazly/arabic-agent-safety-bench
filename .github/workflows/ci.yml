name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate dataset against schema
        run: python scripts/validate_dataset.py
      - name: Run regex baseline
        run: python runner/cli.py --baseline regex --out results/regex_run.json
