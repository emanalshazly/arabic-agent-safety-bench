[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-agent-safety-bench"
version = "0.0.1"
description = "Synthetic Arabic safety benchmark fixtures for tool-using AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
aasb-validate = "aasb.validate:main"
aasb-score = "aasb.score:main"
aasb-review = "aasb.review_server:main"
aasb-promote = "aasb.reviews:main"

[tool.setuptools.packages.find]
where = ["src"]
